<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>92PKR OFFICIAL HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Poppins:wght@700;900&display=swap');
        
        :root {
            --theme-purple: #9d4edd;
            --glow-purple: #e0aaff;
            --glow-cyan: #00f0ff;
            --glow-green: #00ff66;
            --dark-bg: #05010a;
            --cyber-red: #ff003c;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Orbitron', sans-serif; background: #000; }
        
        #bg-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; }
        
        #scan-laser {
            position: fixed; top: -20px; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, transparent, var(--glow-cyan), var(--glow-purple), transparent);
            box-shadow: 0 0 25px var(--glow-cyan), 0 0 15px var(--glow-purple);
            z-index: 100; pointer-events: none; opacity: 0;
        }
        
        @keyframes fullScreenScan {
            0% { top: 0%; opacity: 1; filter: hue-rotate(0deg); }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; filter: hue-rotate(360deg); }
        }
        .active-scan { animation: fullScreenScan 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        #floating-icon {
            position: fixed; top: 30%; right: 15px;
            width: 55px; height: 55px; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--glow-cyan), var(--theme-purple), var(--cyber-red), var(--glow-cyan));
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            z-index: 20; cursor: pointer; display: flex; align-items: center; justify-content: center;
            animation: spin-pulse 3s infinite linear; touch-action: auto;
        }
        
        @keyframes spin-pulse {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); box-shadow: 0 0 30px var(--glow-purple); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        #floating-icon .inner-circle {
            width: 44px; height: 44px; border-radius: 50%;
            background: #000; display: flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: 900; color: var(--glow-cyan); text-align: center; line-height: 1.2;
            border: 2px solid #111; animation: counter-spin 3s infinite linear;
            text-shadow: 0 0 5px var(--glow-cyan);
        }
        @keyframes counter-spin { 100% { transform: rotate(-360deg); } }
        
        .panel-wrapper {
            position: fixed; top: 15%; left: 10px; display: none; z-index: 30; touch-action: auto;
            flex-direction: column; align-items: center;
        }
        
        .flying-robot-container {
            width: 40px; height: 28px; position: relative; margin-bottom: 5px;
            animation: float-robot 2s ease-in-out infinite alternate; z-index: 5;
            pointer-events: none; filter: drop-shadow(0 0 8px var(--glow-cyan));
        }
        @keyframes float-robot {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-10px) scale(1.05); }
        }
        
        .robot-head-unit {
            width: 26px; height: 16px; background: linear-gradient(135deg, #240046, #c77dff);
            border-radius: 6px; margin: 0 auto; position: relative;
            border: 1px solid var(--glow-cyan); box-shadow: 0 0 15px var(--glow-cyan);
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .robot-eye-unit {
            width: 4px; height: 4px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 8px #fff, 0 0 12px var(--glow-cyan); animation: blink-eye 4s infinite;
        }
        @keyframes blink-eye { 0%, 90%, 100% { opacity: 1; height: 4px; } 95% { opacity: 0.1; height: 1px; } }
        .robot-antenna-bar { width: 2px; height: 6px; background: #fff; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); }
        .robot-antenna-bar::after {
            content: ''; position: absolute; top: -4px; left: -2px; width: 6px; height: 6px;
            background: var(--cyber-red); border-radius: 50%; box-shadow: 0 0 10px var(--cyber-red);
            animation: alert-blink 1s infinite;
        }
        @keyframes alert-blink { 50% { opacity: 0.3; } }
        
        .robot-wings { position: absolute; top: 8px; width: 100%; display: flex; justify-content: space-between; }
        .wing { width: 10px; height: 3px; background: var(--glow-cyan); border-radius: 4px; box-shadow: 0 0 8px var(--glow-cyan); }
        .wing.left { transform: rotate(-25deg); animation: wing-flap 0.15s infinite alternate; }
        .wing.right { transform: rotate(25deg); animation: wing-flap 0.15s infinite alternate; }
        @keyframes wing-flap { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }
        
        .timer-capsule {
            background: rgba(0,0,0,0.8); border: 2px solid var(--glow-purple); border-radius: 15px;
            padding: 3px 18px; color: #fff; font-size: 14px; font-weight: 900;
            box-shadow: 0 0 15px var(--glow-purple), inset 0 0 10px var(--theme-purple);
            margin-bottom: 6px; z-index: 4; letter-spacing: 2px;
            backdrop-filter: blur(4px); text-shadow: 0 0 8px #fff;
        }
        
        .panel-box {
            width: 170px; background: rgba(5, 1, 10, 0.85);
            border-radius: 16px; padding: 12px 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden; z-index: 1;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(157, 78, 221, 0.3);
        }
        .panel-box::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, var(--glow-cyan), transparent, var(--glow-purple), transparent);
            animation: rotate-border 3s linear infinite; z-index: -2;
        }
        .panel-box::after {
            content: ''; position: absolute; inset: 2px;
            background: linear-gradient(180deg, rgba(15,2,25,0.95) 0%, rgba(5,1,10,0.95) 100%);
            border-radius: 14px; z-index: -1;
        }
        @keyframes rotate-border { 100% { transform: rotate(360deg); } }
        
        .title {
            font-size: 9px; font-weight: 900;
            letter-spacing: 0.5px;
            text-align: center; text-transform: uppercase; line-height: 1.2;
            background: linear-gradient(90deg, #00f0ff, #e0aaff, #ff003c, #00f0ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow-shift 3s linear infinite, glitch-anim 2s infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
        }
        @keyframes glow-shift { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        @keyframes glitch-anim {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, 1px); }
        }
        
        .mode-sub { font-size: 8px; color: var(--glow-purple); font-weight: 700; margin-top: 3px; margin-bottom: 5px; letter-spacing: 1px; text-shadow: 0 0 5px var(--glow-purple); }
        
        .period-display {
            font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #ccc;
            margin-bottom: 5px; text-align: center; font-weight: bold; width: 100%;
            border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 3px;
        }
        .period-display span { color: var(--glow-cyan); text-shadow: 0 0 5px var(--glow-cyan); }
        
        .live-status-tag {

        .prediction-container {

            min-height: 80px; width: 100%; margin: 6px 0;
            background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid #222;
            box-shadow: inset 0 0 15px #000;
        }
        
        .prediction-text {
            font-size: 14px; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase; color: var(--glow-cyan);
            text-shadow: 0 0 15px var(--glow-cyan);
            margin-bottom: 5px; text-align: center; transition: all 0.3s ease;
        }
        
        .ball-wrapper {
            position: relative; width: 55px; height: 55px;
            display: flex; justify-content: center; align-items: center;
        }
        .rgb-rotating-ring {
            position: absolute; inset: -3px; border-radius: 50%;
            background: conic-gradient(from 0deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            animation: spin-rgb 1.5s linear infinite;
            z-index: -1; filter: blur(3px); opacity: 0.8;
        }
        @keyframes spin-rgb { 100% { transform: rotate(360deg); } }
        
        .wingo-ball {
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 900;
            position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(255,255,255,0.2), inset 0 0 15px rgba(0,0,0,0.9);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .wingo-ball::before {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.05) 4px, rgba(255,255,255,0.05) 8px);
            z-index: 1; pointer-events: none; border-radius: 50%;
        }
        .wingo-ball::after {
            content: ''; position: absolute; top: 2px; left: 10%; width: 80%; height: 35%;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, transparent 100%);
            border-radius: 50%; z-index: 2; pointer-events: none;
        }
        .ball-num-text { position: relative; z-index: 3; line-height: 1; text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.5); }
        
        .ball-red { background: radial-gradient(circle at 50% 50%, #ff1a1a, #660000); box-shadow: 0 0 20px #ff1a1a, inset 0 0 15px #000; }
        .ball-red .ball-num-text { color: #fff; }
        .ball-green { background: radial-gradient(circle at 50% 50%, #00ff66, #004d1a); box-shadow: 0 0 20px #00ff66, inset 0 0 15px #000; }
        .ball-green .ball-num-text { color: #fff; }
        .ball-v-red { background: linear-gradient(135deg, #9d4edd 50%, #ff1a1a 50%); box-shadow: 0 0 20px #9d4edd; }
        .ball-v-red .ball-num-text { color: #fff; }
        .ball-v-green { background: linear-gradient(135deg, #9d4edd 50%, #00ff66 50%); box-shadow: 0 0 20px #00ff66; }
        .ball-v-green .ball-num-text { color: #fff; }

        #btn-lock:active { background: var(--cyber-red); color: #fff; }
        
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 1, 10, 0.98); z-index: 10; display: none; flex-direction: column;

        .modal-title { color: #fff; font-size: 9px; text-align: center; margin-bottom: 8px; font-weight: 900; text-shadow: 0 0 5px var(--glow-cyan); letter-spacing: 1px; }
        
        .input-box {

            background: #000; border: 1px solid var(--theme-purple); border-radius: 6px;
            color: var(--glow-cyan); font-family: 'Share Tech Mono', monospace; text-align: center;
            outline: none; font-size: 9px; touch-action: auto !important; font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,240,255,0.2);
        }
        .input-box:focus { border-color: var(--glow-cyan); }
        
        .btn-cyber-action {
            height: 30px; border-radius: 6px; font-family: 'Orbitron'; font-size: 8px; font-weight: 900;
            cursor: pointer; border: 1px solid var(--glow-cyan); text-transform: uppercase; width: 100%; color: #000;
            background: linear-gradient(90deg, var(--glow-cyan), #00b8ff); touch-action: auto !important;

        .btn-cyber-action:active { transform: scale(0.95); }
        
        .error-msg { color: var(--cyber-red); font-size: 8px; height: 12px; text-align: center; font-weight: bold; text-shadow: 0 0 4px var(--cyber-red); }
        
        .tg-notice {
            font-size: 8px; color: var(--glow-green); text-align: center;
            margin-top: auto; margin-bottom: 4px; font-weight: bold;
            text-shadow: 0 0 5px var(--glow-green); animation: pulse-text 1.5s infinite;
        }
        @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .telegram-link {
            background: linear-gradient(90deg, #25d366, #128c7e); color: #fff; text-decoration: none; display: block; text-align: center;
            padding: 6px; border-radius: 5px; font-size: 8px; font-weight: 900;
            touch-action: auto !important; border: 1px solid #25d366; box-shadow: 0 0 10px rgba(37,211,102,0.5);

        .history-container { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 5px; touch-action: auto !important; border: 1px solid #333; }
        .history-row { display: flex; align-items: center; justify-content: space-between; background: rgba(25,25,35,0.8); padding: 5px 8px; border-radius: 6px; border-left: 3px solid var(--glow-purple); }
        .history-seq { font-family: 'Share Tech Mono'; font-size: 8px; color: #ccc; font-weight: bold; }
        .history-result-info { display: flex; align-items: center; gap: 6px; }
        .history-type { font-size: 8px; font-weight: 900; }
        .type-big { color: #ffbe0b; text-shadow: 0 0 5px #ffbe0b; }
        .type-small { color: var(--glow-cyan); text-shadow: 0 0 5px var(--glow-cyan); }
        .history-ball {
            width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins'; font-size: 11px; font-weight: 900; position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5); color: #fff;
        }
        .history-ball .ball-num-text { z-index: 2; text-shadow: 1px 1px 2px #000; }
        .close-btn { background: #240046; color: #fff; border: 1px solid var(--theme-purple); padding: 6px; border-radius: 6px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; font-size: 8px; touch-action: auto !important; margin-top: auto; }
        .close-btn:active { background: var(--theme-purple); }
    </style>
